<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오사카 가족여행</title><style>body{font-family:system-ui,sans-serif;background:#fffaf6;color:#523c34;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{font-size:42px;animation:b 1.2s infinite alternate}@keyframes b{to{transform:translateY(-6px)}}</style></head><body><div class="box"><div class="spin">✈️</div><b>오사카 가족여행 가이드를 불러오는 중...</b></div><script>(async()=>{try{const files=['parts/p00.b64', 'parts/p01.b64', 'parts/p02.b64', 'parts/p03.b64', 'parts/p04.b64', 'parts/p05.b64', 'parts/p06.b64', 'parts/p07.b64', 'parts/p08.b64', 'parts/p09.b64', 'parts/p10.b64'];const dec=new TextDecoder();const html=(await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f+' '+r.status);const t=(await r.text()).trim();const bytes=Uint8Array.from(atob(t),c=>c.charCodeAt(0));return dec.decode(bytes);}))).join('');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="box"><b>페이지를 불러오지 못했습니다.</b><br><small>'+String(e)+'</small></div>';}})();</script></body></html>
